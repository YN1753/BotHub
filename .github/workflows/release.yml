name: Build, Release and Deploy BotHub

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: bothub-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: bothub-linux-arm64
          - goos: darwin
            goarch: arm64
            binary_name: bothub-darwin-arm64
          - goos: darwin
            goarch: amd64
            binary_name: bothub-darwin-amd64
          - goos: windows
            goarch: amd64
            binary_name: bothub-windows-amd64.exe

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue 3 + Tailwind CSS Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run Go Tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -count=1 ./...

      - name: Build Static Single Binary (Embedded Frontend)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            TAG_AT_HEAD=$(git describe --tags --exact-match --match "v*" 2>/dev/null || true)
            MAIN_VER=$(sed -n 's/.*Version *= *"\([^"]*\)".*/\1/p' main.go | head -n 1)
            LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)
            VERSION="${TAG_AT_HEAD:-${MAIN_VER:-${LATEST_TAG:-v2.11.0}}}"
          fi
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X 'main.BuildTime=${BUILD_TIME}'"
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${{ matrix.binary_name }}" .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 1

  build-android:
    name: Build Android Native Client APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > /tmp/bothub-release.p12
            export ANDROID_KEYSTORE_PATH=/tmp/bothub-release.p12
          fi
          gradle assembleRelease --no-daemon
          rm -f /tmp/bothub-release.p12
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/vesper-bothub-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesper-bothub-android.apk
          path: dist/vesper-bothub-android.apk
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          ls -lh

      - name: Ensure Tag for Latest Branch Builds
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest || true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('BotHub {0}', github.ref_name) || 'BotHub Latest Build' }}
          prerelease: false
          make_latest: ${{ github.ref_type == 'tag' }}
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: Do NOT remove the deploy job below; it handles automatic continuous deployment to the production VPS!
  deploy:
    name: Deploy to CloudCone VPS
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Source for Tag Check
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Deploy Credentials
        id: check-secrets
        run: |
          if [ "${{ github.ref_type }}" != "tag" ] && [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Notice: Tagged release exists at HEAD; skipping duplicate branch deploy."
            exit 0
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Notice: VPS_SSH_KEY secret not found. Skipping auto-deploy step."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Remote VPS Auto-Update via SSH
        if: steps.check-secrets.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.232.94.2' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
            echo "[1/4] Fetching binary (tag: ${TAG}) from GitHub Releases..."
            curl -fsSL -o /tmp/bothub-new "https://github.com/YN1753/BotHub/releases/download/${TAG}/bothub-linux-amd64"
            chmod +x /tmp/bothub-new

            echo "[2/4] Stopping bothub service..."
            systemctl stop bothub || true

            echo "[3/4] Deploying new binary..."
            mv /tmp/bothub-new /opt/bothub/bothub

            echo "[4/4] Restarting and verifying service..."
            systemctl start bothub
            sleep 2
            systemctl is-active --quiet bothub && echo "BotHub deployed successfully and is active!"
